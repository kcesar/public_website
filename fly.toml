# Fly.io config for a shareable preview of the site.
# `app` must be globally unique — change it, or let `fly launch` set it.
app = "kcesar-website-preview"
primary_region = "sea" # Seattle — closest to King County

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle (cheap for a preview), wake on request.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
